title: Home Handover Guide
description: A practical guide for the new owners.

# Tells GitHub to explicitly pull the layout from the official stable release tag
remote_theme: just-the-docs/just-the-docs@v0.7.0

# Tells Jekyll to skip looking for a standard local theme gem
theme: []

# Let's clean up the URLs to match exactly how GitHub routes your Option A setup
url: "https://www.ox1.digital.co.uk"
baseurl: "/1A_Main_Road"

# Navigation configuration to automate alphabetical sorting
nav_sort: title

# Injects custom CSS to override the theme's wide desktop sidebar wrapper
aux_links:
  _style: |
    <style>
      @media (min-width: 64rem) {
        .side-nav { width: 220px !important; }
        .main { margin-left: 220px !important; }
        .main-header { left: 220px !important; }
      }
    </style>
